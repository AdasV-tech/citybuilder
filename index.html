<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#131a24" />
<meta name="description" content="CityBuilder — a browser city simulation: zone, power, plumb and police a city of your own." />
<title>CityBuilder</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Every widget below is populated by JS; the markup here is only the shell. -->
<div id="app">
    <canvas id="game-canvas"></canvas>

    <header id="hud"></header>

    <aside id="panel" class="panel"></aside>
    <section id="selection-card" class="selection-card"></section>
    <div id="notifications" class="notifications"></div>

    <div id="flyout" class="flyout"></div>
    <nav id="toolbar" class="rail" aria-label="Build tools"></nav>

    <div id="cursor-tip" class="cursor-tip"></div>
    <div id="toast" class="toast"></div>

    <div id="boot-error" hidden></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
